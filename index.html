<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-commerce webshop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
       
        <div class="header__top-bar">
            Free Delivery on all order above 150$
        </div>
        <div class="header__container">   
            <a href="#" class="header__logo">
                <img src="img/logo.svg" alt="Sid Logo"> 
                    <span>Sid</span>
            </a>
            <nav class="header__nav">
                <ul class="header__menu">
                    <li><a href="#" class="header__link header__link--active">Shop <span>▼</span></a></li>
                    <li><a href="#" class="header__link">About us</a></li>
                    <li><a href="#" class="header__link">Compare</a></li>
                    <li><a href="#" class="header__link">FAQs</a></li>
                    <li><a href="#" class="header__link">Contact</a></li>
                </ul>
            </nav>
            <div class="header__actions">
                <a href="#" class="header__icon-btn" aria-label="Search">
                    <img src="img/Search.svg" alt="Search">
                </a>
                <a href="#" class="header__icon-btn" aria-label="Profile">
                    <img src="img/User.svg" alt="Profile">
                </a>
                <a href="#" class="header__icon-btn header__cart" aria-label="Cart">
                    <img src="img/Cart.svg" alt="Cart">
                    <span class="header__cart-count">1</span>
                </a>
            </div>
        </div>
    </header>

</body>

</html
